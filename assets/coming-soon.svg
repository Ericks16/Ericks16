<svg viewBox="0 0 820 220" width="820" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <style>
      .big{font-family:'Arial Black','Segoe UI',sans-serif;font-weight:900;font-size:74px;letter-spacing:6px;}
      .sub{font-family:'Courier New',monospace;font-weight:bold;font-size:17px;letter-spacing:5px;}
    </style>
  </defs>

  <!-- marco neon pulsante -->
  <rect x="6" y="6" width="808" height="208" rx="14" fill="#070011" stroke="#ff006e" stroke-width="2" filter="url(#cglow)">
    <animate attributeName="stroke" values="#ff006e;#00f0ff;#a855f7;#ff006e" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- glitch: copias desfasadas cian/magenta -->
  <g class="big" text-anchor="middle">
    <text x="410" y="108" fill="#00f0ff" opacity="0.8" filter="url(#cglow)">
      COMING SOON
      <animate attributeName="x" values="410;404;413;408;410" dur="0.45s" repeatCount="indefinite"/>
    </text>
    <text x="410" y="108" fill="#ff006e" opacity="0.8" filter="url(#cglow)">
      COMING SOON
      <animate attributeName="x" values="410;416;406;412;410" dur="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="410" y="108" fill="#ffffff">
      COMING SOON
      <animate attributeName="opacity" values="1;0.78;1;0.9;1" dur="0.25s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- subtitulo -->
  <text x="410" y="150" class="sub" text-anchor="middle" fill="#00f0ff" filter="url(#cglow)">
    [ ACHIEVEMENTS LOADING ]
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- barra de progreso -->
  <rect x="210" y="172" width="400" height="12" rx="6" fill="#1a0033" stroke="#2a1050"/>
  <rect x="210" y="172" width="60" height="12" rx="6" fill="url(#bar)" filter="url(#cglow)">
    <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.7;0.85;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
