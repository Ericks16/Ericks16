<svg viewBox="0 0 1200 14" width="1200" height="14" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#ff006e"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="6" width="1200" height="2" fill="url(#dg)" filter="url(#dglow)"/>
  <circle cy="7" r="4" fill="#ffffff" filter="url(#dglow)">
    <animate attributeName="cx" values="100;1100;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
