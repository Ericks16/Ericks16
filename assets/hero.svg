<svg viewBox="0 0 1200 250" width="1200" height="250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07010d"/>
      <stop offset="50%" stop-color="#16002e"/>
      <stop offset="72%" stop-color="#3a0a5e"/>
      <stop offset="100%" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe14d"/>
      <stop offset="55%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- cielo -->
  <rect width="1200" height="250" fill="url(#sky)"/>

  <!-- estrellas titilantes -->
  <g fill="#ffffff">
    <circle cx="90" cy="34" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="28" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="70" r="1.0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="40" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="66" r="1.1"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="32" r="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="74" r="1.0"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sol synthwave -->
  <g filter="url(#glow)">
    <circle cx="600" cy="172" r="74" fill="url(#sun)">
      <animate attributeName="r" values="74;78;74" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g fill="#16002e">
      <rect x="520" y="150" width="160" height="4"/>
      <rect x="520" y="160" width="160" height="5"/>
      <rect x="520" y="172" width="160" height="6"/>
      <rect x="520" y="187" width="160" height="8"/>
    </g>
  </g>

  <!-- linea de horizonte neon -->
  <rect x="0" y="168" width="1200" height="2" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>

  <!-- lineas verticales (perspectiva) -->
  <g stroke="#00f0ff" stroke-width="1.1" opacity="0.55">
    <line x1="600" y1="170" x2="-300" y2="250"/>
    <line x1="600" y1="170" x2="-80" y2="250"/>
    <line x1="600" y1="170" x2="120" y2="250"/>
    <line x1="600" y1="170" x2="300" y2="250"/>
    <line x1="600" y1="170" x2="450" y2="250"/>
    <line x1="600" y1="170" x2="550" y2="250"/>
    <line x1="600" y1="170" x2="650" y2="250"/>
    <line x1="600" y1="170" x2="750" y2="250"/>
    <line x1="600" y1="170" x2="900" y2="250"/>
    <line x1="600" y1="170" x2="1080" y2="250"/>
    <line x1="600" y1="170" x2="1280" y2="250"/>
    <line x1="600" y1="170" x2="1500" y2="250"/>
  </g>

  <!-- lineas horizontales avanzando hacia el espectador -->
  <g stroke="#ff2d95" stroke-width="1.4" opacity="0.8">
    <line x1="0" x2="1200" y1="170" y2="170">
      <animate attributeName="y1" values="170;250" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="170;250" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="170" y2="170">
      <animate attributeName="y1" values="170;250" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="170;250" dur="3s" begin="0.75s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9" dur="3s" begin="0.75s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="170" y2="170">
      <animate attributeName="y1" values="170;250" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="170;250" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" x2="1200" y1="170" y2="170">
      <animate attributeName="y1" values="170;250" dur="3s" begin="2.25s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="170;250" dur="3s" begin="2.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0.9" dur="3s" begin="2.25s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
